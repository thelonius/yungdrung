# Конфигурация инструментов проверки. Пакетом проект не собирается: код едет на
# машину заказчика через git pull и запускается из папки репозитория, поэтому
# секции [project]/[build-system] здесь нет намеренно.

[tool.pytest.ini_options]
testpaths = ["tests"]
# Имена тестов русские («test_шаг_не_закрывается_дважды») — это читаемый отчёт,
# а не небрежность, поэтому стандартную маску имён не сужаем.
python_files = ["test_*.py"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["examples", "todos", "База", "Задачи"]

[tool.ruff.lint]
# Узкий набор осознанно: E/F/W ловят настоящие ошибки (неиспользуемые имена,
# недостижимый код, битые импорты) и не спорят со стилем. Расширять по одному
# правилу за раз, когда для правила есть повод, а не пакетом.
select = ["E", "F", "W"]

[tool.ruff.lint.per-file-ignores]
# Объявление CLI-команд — таблица: «add_parser; add_argument; add_argument» в
# строку читается как одна запись, разнесённое по строкам — как проза. Уедет
# вместе с CLI в apps/cli/ (REFACTOR.md, срез 5).
"engine.py" = ["E702"]
"tests/test_backup.py" = ["E702"]
# Внутри модуля лежит скрипт PowerShell строкой: его строки нельзя переносить,
# это чужой синтаксис, и noqa внутри строкового литерала не поставить.
"notify.py" = ["E501"]

[tool.mypy]
# Проверяет только новые слои. На engine.py
# mypy не наводим: 3000 строк без аннотаций дадут отчёт, который никто не
# прочтёт, а сам файл демонтируется в срезе 5.
files = ["core", "domain", "api"]
python_version = "3.11"
ignore_missing_imports = true
# Старые модули (settings, kb, worktime, store) импортируются новыми слоями,
# но проверяются не они: их ошибки типов уйдут вместе с их переездом.
follow_imports = "silent"
# Мягкий старт: требуем аннотации только там, где они уже есть, и запрещаем
# молча терять типы. Строгость наращивать по мере переезда модулей.
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
# Перенесён файлом из корня (срез 2, Р11), аннотации — в срезе 4. Три места без
# типа у пустых контейнеров — не повод переписывать календарную математику
# в коммите, который её только двигает.
module = "domain.recurrence"
check_untyped_defs = false
