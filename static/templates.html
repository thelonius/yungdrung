<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Шаблоны — Yungdrung</title>
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/feed.css">
<link rel="stylesheet" href="/templates.css">
</head>
<body>

<main class="wrap">

  <header class="head">
    <div class="head-row">
      <h1>Шаблоны</h1>
      <div class="head-links">
        <a class="ghost small" href="/">К ленте</a>
      </div>
    </div>
    <p class="hint">Однотипные задачи заводятся по нажатию, без ручного набора шагов заново.</p>
  </header>

  <ol class="tpl-list" id="list"></ol>
  <p class="empty" id="empty" hidden>Шаблонов пока нет. Их удобно делать из готовой задачи —
    кнопка «В шаблон» есть в окне контроля на ленте.</p>

</main>

<!-- Развёртывание шаблона: дата старта → предпросмотр всех дат → создать. -->
<dialog id="expand">
  <form method="dialog" class="control-card">
    <header class="control-head">
      <p class="control-task" id="x-name"></p>
      <h2 class="control-step">Дата старта</h2>
    </header>

    <div class="control-form" style="display:flex; flex-direction:column; gap:16px;">
      <div class="field">
        <label for="x-start">Когда начинать</label>
        <div class="presets">
          <button type="button" data-when="сегодня">сегодня</button>
          <button type="button" data-when="завтра">завтра</button>
          <button type="button" data-when="пн">с понедельника</button>
        </div>
        <input type="text" id="x-start" autocomplete="off" placeholder="или свой вариант: 18.08, +3">
      </div>

      <div class="field">
        <label for="x-title">Название задачи <span class="opt">необязательно</span></label>
        <input type="text" id="x-title" autocomplete="off" placeholder="по умолчанию — имя шаблона">
      </div>

      <ol class="tpl-preview" id="x-preview"></ol>
      <p class="err" id="x-err" hidden></p>
    </div>

    <div class="control-actions">
      <button type="button" class="primary" id="x-save">Создать задачу</button>
      <button type="button" class="ghost" id="x-back">Отмена</button>
    </div>
  </form>
</dialog>

<!-- Настройка повторения. Простой путь: частота, шаг, дни недели, число месяца.
     Вхождение в месяце и перенос с выходных не выведены сюда намеренно — заказчик
     их словами не подтверждал (вопрос Q26 в ТЗ), а движок ими и так пользуется,
     если появятся в JSON руками. -->
<dialog id="recur">
  <form method="dialog" class="control-card">
    <header class="control-head">
      <p class="control-task" id="r-name"></p>
      <h2 class="control-step">Повторение</h2>
    </header>

    <div class="control-form" style="display:flex; flex-direction:column; gap:16px;">
      <div class="field">
        <label for="r-freq">Как часто</label>
        <select id="r-freq">
          <option value="daily">каждый день</option>
          <option value="weekly">по дням недели</option>
          <option value="monthly" selected>раз в месяц</option>
          <option value="yearly">раз в год</option>
        </select>
      </div>

      <div class="field">
        <label for="r-interval">Каждые сколько <span class="opt">1 — без пропусков</span></label>
        <input type="text" id="r-interval" autocomplete="off" value="1" style="max-width:100px;">
      </div>

      <div class="field" id="r-weekday-field" hidden>
        <label>Дни недели</label>
        <div class="weekdays" id="r-weekdays">
          <label><input type="checkbox" value="0"> пн</label>
          <label><input type="checkbox" value="1"> вт</label>
          <label><input type="checkbox" value="2"> ср</label>
          <label><input type="checkbox" value="3"> чт</label>
          <label><input type="checkbox" value="4"> пт</label>
          <label><input type="checkbox" value="5"> сб</label>
          <label><input type="checkbox" value="6"> вс</label>
        </div>
      </div>

      <div class="field" id="r-monthday-field">
        <label for="r-monthday">Число месяца <span class="opt">-1 — последний день</span></label>
        <input type="text" id="r-monthday" autocomplete="off" placeholder="например 5" style="max-width:140px;">
      </div>

      <div class="field">
        <label for="r-anchor">Первый цикл от даты</label>
        <input type="text" id="r-anchor" autocomplete="off" placeholder="18.08, завтра, +3">
      </div>

      <p class="tpl-recur-desc" id="r-desc"></p>
      <p class="err" id="r-err" hidden></p>
    </div>

    <div class="control-actions">
      <button type="button" class="primary" id="r-save">Сохранить</button>
      <button type="button" class="quiet" id="r-clear">Убрать повторение</button>
      <button type="button" class="ghost" id="r-back">Отмена</button>
    </div>
  </form>
</dialog>

<script src="/templates.js"></script>
</body>
</html>
