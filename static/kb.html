<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>База знаний — Yungdrung</title>
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/feed.css">
<link rel="stylesheet" href="/kb.css">
</head>
<body>

<main class="wrap">

  <header class="head">
    <div class="head-row">
      <h1>База знаний</h1>
      <div class="head-links">
        <a class="ghost small" href="/">К ленте</a>
        <a class="ghost small" href="/база/запись">Новая запись</a>
      </div>
    </div>
  </header>

  <div class="kb-toolbar">
    <input type="text" id="search" class="tasks-search" autocomplete="off"
           placeholder="Найти по названию…">
  </div>

  <p class="err" id="load-err" hidden></p>

  <ol class="feed kb-notes-list" id="notes-list"></ol>

  <div class="empty" id="empty" hidden>
    <p id="empty-text">Записей пока нет.</p>
    <a class="ghost small" href="/база/запись">Новая запись</a>
  </div>

</main>

<script src="/kb.js"></script>
</body>
</html>
